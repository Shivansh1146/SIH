<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ThreatLens-Shield</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 26 26" fill="none">
        <circle cx="11" cy="11" r="7.5" stroke="#49D6C4" stroke-width="2"/>
        <line x1="16.2" y1="16.2" x2="23" y2="23" stroke="#49D6C4" stroke-width="2" stroke-linecap="round"/>
        <path d="M11 7.5V11L13.5 13" stroke="#49D6C4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>ThreatLens-Shield</span>
    </div>
  </div>

  <div class="container">
    <div id="loading" class="state-block">
      <div class="spinner"></div>
      <p>Analyzing current site...</p>
    </div>

    <div id="error" class="state-block hidden">
      <p>Could not connect to ThreatLens-Shield API.</p>
      <button class="btn btn-primary" id="btn-retry">Try Again</button>
    </div>

    <div id="result" class="hidden">
      <div class="site-info">
        <span class="label">Current site:</span>
        <div class="url-text" id="url-text">...</div>
      </div>
      
      <div class="verdict-box" id="verdict-box">
        <div class="verdict-header">
          <span class="label">Risk Verdict:</span>
          <span class="badge" id="badge">SAFE</span>
        </div>
        <div class="score-row">
          <span class="label">Risk Score:</span>
          <span class="score"><strong id="score-text">0</strong>/100</span>
        </div>
      </div>

      <div class="reasons-box">
        <span class="label">Primary Indicators:</span>
        <ul id="reasons-list">
          <!-- Reasons will be injected here -->
        </ul>
      </div>

      <button class="btn btn-secondary" id="btn-scan">Scan Again</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
