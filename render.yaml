# render.yaml — Render.com deployment config for ThreatLens-Shield backend
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: threatlens-shield-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-prod.txt
    startCommand: python app.py
    plan: free
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://threatlens-shield.netlify.app
      - key: FLASK_ENV
        value: production
      # Set PYTHON_VERSION if required by your runtime
      # - key: PYTHON_VERSION
      #   value: "3.11"
